service: illustration-portal

image: mousu-a/illustration_portal

servers:
  web:
    # TODO(mousu): Lightsailインスタンスに割り当てた静的IPに置き換える
    - 192.0.2.1

proxy:
  ssl: true
  # TODO(mousu): 取得したドメインに置き換え、DNSのAレコードを上記IPへ向ける
  host: illustration-portal.example.com

deploy_timeout: 120

registry:
  server: ghcr.io
  username: mousu-a
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - ILLUSTRATION_PORTAL_DATABASE_PASSWORD
  clear:
    SOLID_QUEUE_IN_PUMA: true
    DB_HOST: illustration-portal-db

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "illustration_portal_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

# Lightsail(Ubuntu)の既定ユーザー。sudo権限があるため初回の `kamal setup` でDockerも自動インストールされる
ssh:
  user: ubuntu

accessories:
  db:
    image: postgres:18
    roles:
      - web
    env:
      clear:
        POSTGRES_DB: illustration_portal_production
        POSTGRES_USER: illustration_portal
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql
